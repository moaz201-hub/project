<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Falkons</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="full.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

    <div class="navbar">
        <div class="nav-container">
            <div class="logo-con"><h1 class="logo">Falkons</h1></div>
            <div class="menue-con">
                <ul class="menue-items">
                    <li class="menue-list"><b>Home</b></li>
                    <li class="menue-list">Moveis</li>
                    <li class="menue-list">Series</li>
                    <li class="menue-list">Popular</li>
                    <li class="menue-list">Trends</li> 
                </ul>
            </div>
            <div class="profile-con">
                <img src="8f207f39b8ab375299430358fa838829.jpg" class="profile-pic" alt="profile-picture">
                <div class="text-con"> 
                    <span class="profile-text">Profile </span>
                    <i class="fa-solid fa-circle-chevron-down"></i>
                </div>
                <div class="toggle">
                    <i class="fa-solid fa-moon toggle-icon"></i>
                    <i class="fa-regular fa-moon toggle-icon"></i>
                    <div class="toggle-ball"></div>

                </div>
            </div>
        </div>
    </div>
    <div class="sidebar">
        <i class="left-menue-icon fa-solid fa-house"></i>
        <i class="left-menue-icon fa-solid fa-magnifying-glass"></i>
        <i class="left-menue-icon fa-regular fa-bookmark"></i>
        <i class="left-menue-icon fa-solid fa-user"></i>
        <i class="left-menue-icon fa-solid fa-tv"></i>
        <i class="left-menue-icon fa-solid fa-hourglass-end"></i>
        <i class="left-menue-icon fa-solid fa-cart-arrow-down"></i>

    </div>
    <div class="container">
        <div class="content-container">
            <div class="movie-content"
            style="background:linear-gradient(to bottom,rgba(0,0,0,0),#1A1953), url('a82f7e2c1c21aaec9044be999ef78ff8.jpg');"
            >

            </div>

        </div>
    </div>
    
</body>
</html>
